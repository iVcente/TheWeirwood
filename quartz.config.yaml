# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: The Weirwood
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: null
  locale: en-US
  baseUrl: theweirwood.boo
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    # Three voices of type: Cinzel = inscription, EB Garamond = the maester's
    # hand, IBM Plex Mono = the ledger (also used for UI chrome in custom.scss).
    # The object form is what quartz/util/theme.ts consumes; the YAML schema
    # only describes the string form, so editors will flag these — that is
    # cosmetic, nothing validates this file at build time.
    typography:
      header:
        name: Cinzel
        weights: [400, 500, 600, 700]
      body:
        name: EB Garamond
        weights: [400, 500]
        includeItalic: true
      code:
        name: IBM Plex Mono
        weights: [400, 500]
        includeItalic: true
    # Dark is the ONLY mode. The `darkmode` plugin is disabled below, which
    # means nothing ever sets :root[saved-theme="dark"] — so `lightMode` is the
    # palette that always applies. `darkMode` is kept identical so that
    # re-enabling the toggle can never produce a light page.
    colors:
      lightMode: &weirwoodPalette
        light: "#17130f" # page background — warm ink black
        lightgray: "#2a231b" # borders, rules, hr
        gray: "#6f6152" # muted text, graph nodes
        darkgray: "#c8bba4" # body prose text
        dark: "#ece0c8" # headings, brightest text
        secondary: "#b23a2e" # links, titles, active graph node
        tertiary: "#c7503f" # hover / visited accent
        highlight: "#241813" # internal-link & search background tint
        # ==mark== background. The handoff notes "Quartz applies ~50% alpha",
        # which is not true in v5 — this token is painted opaque (stock tokens
        # carry their own 8-digit alpha). The 7a mockup and screenshot both show
        # the mark as this olive-gold rather than a brighter amber, so the
        # screenshot wins. Dark text on top comes from custom.scss.
        textHighlight: "#8f6b1f"
      darkMode: *weirwoodPalette
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: vesper
        dark: vesper
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  # No sidebar to host it, and the broadsheet reads top-to-bottom.
  - source: "@quartz-community/table-of-contents"
    enabled: false
    order: 50
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
      # No arrow glyph after an outbound link. The plugin appends an inline SVG
      # to every external anchor by default; on a page of prose that reads as a
      # printing error, and the colophon — a column of nothing but outbound
      # credits — wore one on every line. Off at the source rather than hidden
      # in CSS, so the mark is never emitted at all.
      externalLinkIcon: false
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  # This plugin does NOT read configuration.theme.typography — it resolves its
  # own options and otherwise falls back to Quartz's stock Schibsted Grotesk /
  # Source Sans Pro, emitting a --bodyFont/--headerFont block that loads AFTER
  # the theme's. It must be told the same three fonts or it silently wins.
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      header:
        name: Cinzel
        weights: [400, 500, 600, 700]
      body:
        name: EB Garamond
        weights: [400, 500]
        includeItalic: true
      code:
        name: IBM Plex Mono
        weights: [400, 500]
        includeItalic: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  # Replaced by ./plugins/weirwood-chrome, which registers the section-index
  # page type itself — generation included. See the comment on that plugin's
  # `plugin` export for why layering over this one instead would have rendered
  # any folder without an index.md with the stock dated listing, silently.
  - source: "@quartz-community/folder-page"
    enabled: false
  # Replaced by ./plugins/weirwood-tags, which registers the tag page type
  # itself — generation included, for the same reason weirwood-chrome owns the
  # section index. Every tag page but /tags is a VIRTUAL page, and a virtual
  # page is emitted with the body of whichever page type GENERATED it, so
  # leaving generation here would have left the new design unrendered while
  # every tag still looked wired up.
  - source: "@quartz-community/tag-page"
    enabled: false
  # The design is a single-column broadsheet with no sidebars, so the explorer
  # has nowhere to live. Navigation is the top bar, the landing count boxes, the
  # roots tiles at the foot of a section index, and in-page links.
  - source: "@quartz-community/explorer"
    enabled: false
  # Graph stays ENABLED but is deliberately given no `layout` block:
  # weirwood-chrome and weirwood-landing compose it themselves, parked off-screen
  # so the greensight buttons have a real overlay to open. A registered but
  # unplaced component still has its CSS and scripts emitted (componentResources
  # collects from the registry, not the layout), so this is the real interactive
  # d3 graph. Disabling it would leave every greensight control dead.
  - source: "@quartz-community/graph"
    enabled: true
  # There is no backlink list on this site. Connections live in the greensight
  # graph, which keeps the roots band one height whether seven pages lead to an
  # entry or twenty-five — the reason that band can sit above the prose at all.
  # weirwood-article still counts inbound links for the band's sub-label, from
  # crawl-links (file.links), not from this plugin.
  - source: "@quartz-community/backlinks"
    enabled: false
  # The bar's second control, immediately after the greensight button that
  # weirwood-chrome renders. Icon-only, and dressed to match it in custom.scss.
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 20
  # Excluded from every page type below: the title belongs inside the glowing
  # title block, over the emblem or the tag mark, which means weirwood-article,
  # weirwood-chrome and weirwood-tags each draw their own. Kept enabled so a
  # page type that has no title block of its own still states its name.
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  # Replaced by the frontmatter metadata boxes in weirwood-article.
  - source: "@quartz-community/content-meta"
    enabled: false
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  # Superseded in the bar by weirwood-chrome's wordmark, which sets the tree
  # mark beside it and the current section after it. That bar renders on every
  # page but the front door — tag pages included — so nothing is left without a
  # way home.
  - source: "@quartz-community/page-title"
    enabled: false
    layout:
      position: header
      priority: 10
  # Dark is the only mode — see the `theme.colors` comment above. Leaving this
  # disabled is what keeps :root[saved-theme="dark"] unset.
  - source: "@quartz-community/darkmode"
    enabled: false
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
  # No breadcrumbs anywhere: the bar states the section, the page states the
  # page, and a trail that repeats both above the title only pushes the entry
  # down. Section is reachable from the bar and from the roots tiles.
  - source: "@quartz-community/breadcrumbs"
    enabled: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  # Replaced by ./plugins/weirwood-footer, which says the same thing in the
  # site's own voice. This plugin's "Created with" string is hardcoded and
  # localised — `links` is the only thing it exposes — so rewording it means
  # rendering the footer ourselves.
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: false
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  # Local plugins (symlinked from ./plugins, never built).
  #
  # Landing: the 9a hero — canopy/roots weirwood, heartglow, wordmark, the
  # greensight CTA — plus the count-box row. Renders nothing off the index, and
  # registers the page type that gives the index its own frame.
  - source: ./plugins/weirwood-landing
    enabled: true
    options:
      # "" points the CTA at Quartz's global-graph overlay. Set a slug here to
      # send it to a real page instead.
      ctaLink: ""
    layout:
      position: beforeBody
      priority: 1
  # Chrome: the top bar on every page but the front door — tree mark, wordmark,
  # the section being read, and the greensight button — plus the section-index
  # page type (hero, entry cards, "roots of the tree" strip) and the ten emblems
  # all three page types share.
  #
  # This plugin also ships the site's only afterDOMLoaded script: the greensight
  # wiring for every [data-greensight] control on the page, and the search
  # preview fix. Component resources are emitted site-wide, so both reach the
  # landing too — which is exactly why weirwood-landing must NOT wire its own
  # CTA. Two handlers would open and shut the overlay inside a single press.
  - source: ./plugins/weirwood-chrome
    enabled: true
    layout:
      position: header
      priority: 10
  # Article: the title block (emblem watermark, title, words, tags), the
  # frontmatter boxes and the "roots of this page" band, all above the prose.
  # Renders nothing on the index, a folder index or a tag page.
  - source: ./plugins/weirwood-article
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # Tags: the tag page type — the tag hero over its radiating mark, the tagged
  # entries grouped by the section each one lives in, and the kindred-tags band
  # that closes the page. It also renders /tags, which is a real (and unlisted)
  # file rather than a generated one, as the card index of every tag.
  #
  # No `layout:` block: a page type's body is called directly, never placed by
  # the layout loader, and its CSS ships regardless — componentResources
  # collects from the registry.
  - source: ./plugins/weirwood-tags
    enabled: true
  # Footer: the stock "Created with Quartz v5.0.0 © 2026" in the site's voice,
  # and without the copyright — Quartz is MIT-licensed and the notice the licence
  # asks for lives in LICENSE.txt, so the credit here is courtesy. That courtesy
  # is now paid on the colophon rather than in the bar itself, which is also
  # where the heart tree's CC BY attribution lives.
  #
  # Other blessings, if this one wears thin:
  #   Set down by many hands, in candlelight.
  #   Copied fair at the Citadel, by many hands.
  #   Sung into the roots by many hands.
  #   Bound in weirwood by many hands.
  #   Carved into the heart tree by many hands.
  - source: ./plugins/weirwood-footer
    enabled: true
    options:
      # The line runs `blessing` → link → `coda`, and reads
      # "Warded by the Old Gods, raised by many hands."
      #
      # The link is not decoration: the colophon carries the attribution the
      # heart tree's CC BY licence requires, and this sentence is the only route
      # to it from an ordinary page. Repoint or reword it freely, but it has to
      # keep leading there — see the note in README.md. The href is used
      # verbatim, so it is site-absolute.
      blessing: "Warded by the Old Gods, raised by"
      linkLabel: "many hands"
      linkHref: "/colophon"
      coda: "."
      # Rendered as a list after the sentence. Empty: the one link this site has
      # is in the sentence itself.
      links: {}
    layout:
      position: footer
      priority: 50
  # Touch icon: an emitter, no layout and no component. WebKit asks the site
  # ROOT for /apple-touch-icon-precomposed.png and then /apple-touch-icon.png
  # whenever it wants a high-resolution icon and the document declares none —
  # which Head.tsx does not. Both probes 404'd; this writes both files so they
  # do not. Deliberately not a <link rel="apple-touch-icon"> in Head.tsx: that
  # would be a third LOCAL MODIFICATION for a Quartz upgrade to revert without
  # saying so, and the root-path guess needs nothing in the document at all.
  - source: ./plugins/weirwood-touch-icon
    enabled: true
    options:
      # The same file @quartz-community/favicon reads, so swapping icon.png
      # between icon-face.png and icon-tree.png moves both marks at once.
      source: "quartz/static/icon.png"
      # What iOS asks for. Leave the source at 512 and let sharp come down.
      size: 180
      # icon.png has an alpha channel and iOS backs a transparent home-screen
      # icon with black. This is the landing's theme-color in Head.tsx; keep
      # the three values in step.
      background: "#2b1813"
  # MUST stay enabled: despite the name, this plugin is the frontmatter
  # transformer as well as the properties-table component. Disabling it strips
  # frontmatter from every page — titles become "Untitled" and nothing that
  # reads fileData.frontmatter renders. `hidePropertiesView` turns off only the
  # table, which the metadata boxes in weirwood-article replace.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: []
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    # Every entry is a single-column broadsheet: `template` sets the frame for
    # the whole page type, which is what drops the sidebars sitewide. The title
    # is drawn by weirwood-article, inside the glowing title block over the
    # section emblem, so Quartz's own is excluded here.
    #
    # NOTE on `exclude`: it matches whatever `extractPluginName` returns for the
    # source, which is the FULL string for an npm plugin but only the BASENAME
    # for a local one. So an npm plugin must be spelled out in full, and a local
    # plugin must be spelled WITHOUT its ./plugins/ prefix. Both forms are wrong
    # the other way round, and a wrong one matches nothing, silently.
    content:
      template: full-width
      exclude:
        - "@quartz-community/article-title"
      positions:
        left: []
        right: []
    # The front door. The weirwood-landing plugin claims the index via a page
    # type; the hero already states the title, so Quartz's own title and table
    # of contents would only repeat it above the fold, and the bar would sit
    # across the artwork.
    landing:
      exclude:
        - "@quartz-community/article-title"
        - "@quartz-community/table-of-contents"
        - weirwood-article
        - weirwood-chrome
      positions:
        left: []
        right: []
    # A section index. weirwood-chrome supplies the whole body — hero, entry
    # cards, roots strip — so nothing belongs above it.
    folder:
      template: full-width
      exclude:
        - "@quartz-community/article-title"
        - "@quartz-community/table-of-contents"
        - weirwood-article
      positions:
        left: []
        right: []
    # A tag page. weirwood-tags supplies the whole body — hero, section groups,
    # kindred band — so, as on a section index, nothing belongs above it.
    tag:
      template: full-width
      exclude:
        - "@quartz-community/article-title"
        - "@quartz-community/table-of-contents"
        - weirwood-article
      positions:
        left: []
        right: []
    canvas: {}
    bases: {}
