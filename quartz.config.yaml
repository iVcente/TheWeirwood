# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: The Weirwood
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    provider: null
  locale: en-US
  baseUrl: theweirwood.boo
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    # Three voices of type: Cinzel = inscription, EB Garamond = the maester's
    # hand, IBM Plex Mono = the ledger (also used for UI chrome in custom.scss).
    # The object form is what quartz/util/theme.ts consumes; the YAML schema
    # only describes the string form, so editors will flag these — that is
    # cosmetic, nothing validates this file at build time.
    typography:
      header:
        name: Cinzel
        weights: [400, 500, 600, 700]
      body:
        name: EB Garamond
        weights: [400, 500]
        includeItalic: true
      code:
        name: IBM Plex Mono
        weights: [400, 500]
        includeItalic: true
    # Dark is the ONLY mode. The `darkmode` plugin is disabled below, which
    # means nothing ever sets :root[saved-theme="dark"] — so `lightMode` is the
    # palette that always applies. `darkMode` is kept identical so that
    # re-enabling the toggle can never produce a light page.
    colors:
      lightMode: &weirwoodPalette
        light: "#17130f" # page background — warm ink black
        lightgray: "#2a231b" # borders, rules, hr
        gray: "#6f6152" # muted text, graph nodes
        darkgray: "#c8bba4" # body prose text
        dark: "#ece0c8" # headings, brightest text
        secondary: "#b23a2e" # links, titles, active graph node
        tertiary: "#c7503f" # hover / visited accent
        highlight: "#241813" # internal-link & search background tint
        # ==mark== background. The handoff notes "Quartz applies ~50% alpha",
        # which is not true in v5 — this token is painted opaque (stock tokens
        # carry their own 8-digit alpha). The 7a mockup and screenshot both show
        # the mark as this olive-gold rather than a brighter amber, so the
        # screenshot wins. Dark text on top comes from custom.scss.
        textHighlight: "#8f6b1f"
      darkMode: *weirwoodPalette
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: vesper
        dark: vesper
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  # No sidebar to host it, and the broadsheet reads top-to-bottom.
  - source: "@quartz-community/table-of-contents"
    enabled: false
    order: 50
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  # This plugin does NOT read configuration.theme.typography — it resolves its
  # own options and otherwise falls back to Quartz's stock Schibsted Grotesk /
  # Source Sans Pro, emitting a --bodyFont/--headerFont block that loads AFTER
  # the theme's. It must be told the same three fonts or it silently wins.
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      header:
        name: Cinzel
        weights: [400, 500, 600, 700]
      body:
        name: EB Garamond
        weights: [400, 500]
        includeItalic: true
      code:
        name: IBM Plex Mono
        weights: [400, 500]
        includeItalic: true
  - source: "@quartz-themes/core"
    enabled: false
    options:
      theme: tokyo-night
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  # The design is a single-column broadsheet with no sidebars, so the explorer
  # has nowhere to live. Navigation is the top bar, the landing count boxes,
  # breadcrumbs and in-page links.
  - source: "@quartz-community/explorer"
    enabled: false
  # Graph stays ENABLED but is deliberately given no `layout` block:
  # weirwood-article and weirwood-landing render it themselves, relocated into
  # the "roots of this page" band and behind the greensight CTA. A registered
  # but unplaced component still has its CSS and scripts emitted
  # (componentResources collects from the registry, not the layout), so this is
  # the real interactive d3 graph. Disabling it would break both.
  - source: "@quartz-community/graph"
    enabled: true
  # Backlinks are rendered directly by weirwood-article — the band needs a
  # two-column list with a count in its label, which is further from this
  # component's markup than it is worth fighting. The data comes from
  # crawl-links (file.links), not from this plugin.
  - source: "@quartz-community/backlinks"
    enabled: false
  # The slim top bar: site title on the left, search on the right.
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 20
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  # Replaced by the frontmatter metadata boxes in weirwood-article.
  - source: "@quartz-community/content-meta"
    enabled: false
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: header
      priority: 10
  # Dark is the only mode — see the `theme.colors` comment above. Leaving this
  # disabled is what keeps :root[saved-theme="dark"] unset.
  - source: "@quartz-community/darkmode"
    enabled: false
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  # Replaced by ./plugins/weirwood-footer, which says the same thing in the
  # site's own voice. This plugin's "Created with" string is hardcoded and
  # localised — `links` is the only thing it exposes — so rewording it means
  # rendering the footer ourselves.
  - source: "@quartz-community/footer"
    enabled: false
    options:
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: false
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  # Local plugins (symlinked from ./plugins, never built).
  #
  # Landing: the 9a hero — canopy/roots weirwood, heartglow, wordmark, the
  # greensight CTA — plus the count-box row. Renders nothing off the index, and
  # registers the page type that gives the index its own frame.
  - source: ./plugins/weirwood-landing
    enabled: true
    options:
      # "" points the CTA at Quartz's global-graph overlay. Set a slug here to
      # send it to a real page instead.
      ctaLink: ""
    layout:
      position: beforeBody
      priority: 1
  # Article: the frontmatter metadata boxes and the "roots of this page" band
  # (Greensight + backlinks), both above the prose. Renders nothing on the index.
  - source: ./plugins/weirwood-article
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  # Footer: the stock "Created with Quartz v5.0.0 © 2026" in the site's voice,
  # and without the copyright — Quartz is MIT-licensed and the notice the licence
  # asks for lives in LICENSE.txt, so the credit here is courtesy, which the
  # blessing pays in full.
  #
  # Other blessings, if this one wears thin:
  #   Carved into the heart tree with Quartz v5.0.0
  #   Grown from Quartz v5.0.0, watered by the Old Gods
  #   Set down by candlelight with Quartz v5.0.0
  #   Copied fair at the Citadel with Quartz v5.0.0
  #   Sung into the roots by Quartz v5.0.0
  #   Bound in weirwood and Quartz v5.0.0
  #   Carried north by raven and Quartz v5.0.0
  - source: ./plugins/weirwood-footer
    enabled: true
    options:
      # The line runs `blessing` → Quartz link → `coda`.
      blessing: "Warded by the Old Gods, raised with"
      coda: "blessing."
      links: {}
    layout:
      position: footer
      priority: 50
  # MUST stay enabled: despite the name, this plugin is the frontmatter
  # transformer as well as the properties-table component. Disabling it strips
  # frontmatter from every page — titles become "Untitled" and nothing that
  # reads fileData.frontmatter renders. `hidePropertiesView` turns off only the
  # table, which the metadata boxes in weirwood-article replace.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties: []
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    # Every article is a single-column broadsheet: `template` sets the frame for
    # the whole page type, which is what drops the sidebars sitewide.
    content:
      template: full-width
      positions:
        left: []
        right: []
    # The front door. The weirwood-landing plugin claims the index via a page
    # type; the hero already states the title, so Quartz's own title, breadcrumb
    # and table of contents would only repeat it above the fold.
    #
    # These must be full source strings — `exclude` compares against the
    # plugin's `source` verbatim, so short names silently match nothing.
    landing:
      exclude:
        - "@quartz-community/article-title"
        - "@quartz-community/breadcrumbs"
        - "@quartz-community/table-of-contents"
        - "@quartz-community/page-title"
        - ./plugins/weirwood-article
      positions:
        left: []
        right: []
    folder:
      template: full-width
      exclude:
        - "@quartz-community/table-of-contents"
        - ./plugins/weirwood-article
      positions:
        left: []
        right: []
    tag:
      template: full-width
      exclude:
        - "@quartz-community/table-of-contents"
        - ./plugins/weirwood-article
      positions:
        left: []
        right: []
    canvas: {}
    bases: {}
